name: Kernel Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: 📥 Checkout kernel source
      uses: actions/checkout@v4

    - name: ⚙️ Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf libncurses-dev libncurses5-dev \
          liblz4-tool libssl-dev libxml2 libxml2-utils lzop \
          rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
          python2 python-is-python3

        sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

        sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1
        sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 2

    - name: 🛠️ Set executable permission on build.sh
      run: chmod +x build.sh

    - name: 🚀 Run build.sh
      run: ./build.sh

    - name: 📦 Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: Persephone-Kernel
        path: AnyKernel3/*.zip
        retention-days: 7
