name: GCC Kernel Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: 📥 Checkout Source
      uses: actions/checkout@v4

    - name: 🛠 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf imagemagick libncurses-dev libncurses5-dev \
          liblz4-tool libssl-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
          python2 python-is-python3

    - name: 🧰 Clone GCC Toolchains
      run: |
        git clone --depth=1 https://github.com/sohamxda7/llvm-stable -b gcc64 gcc
        git clone --depth=1 https://github.com/sohamxda7/llvm-stable -b gcc32 gcc32
        git clone https://android.googlesource.com/platform/system/libufdt scripts/ufdt

    - name: 📁 Prepare Output Folder
      run: |
        mkdir -p out AnyKernel3

    - name: 🔨 Build Kernel
      run: |
        chmod +x build.sh
        ./build.sh

    - name: 📦 Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Persephone-ZIP
        path: AnyKernel3/*.zip
        retention-days: 7
