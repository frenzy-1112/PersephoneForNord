name: Persephone Kernel CI

on:
  workflow_dispatch:
  push:
    branches:
      - 11  # Match your repo branch

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: 📥 Checkout Kernel Source
        uses: actions/checkout@v4

      - name: ⚙️ Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache flex git gnupg gperf libncurses5-dev \
            libssl-dev libtool libxml2-utils lzop nano openjdk-11-jdk \
            python2 python-is-python3 rsync unzip wget zip zlib1g-dev

      - name: 🔧 Clone Toolchains
        run: |
          mkdir -p /home/runner/toolchains
          cd /home/runner/toolchains

          echo "Cloning Azure Clang"
          git clone --depth=1 https://gitlab.com/Panchajanya1999/azure-clang.git clang-llvm

          echo "Cloning GCC64"
          git clone --depth=1 https://github.com/sohamxda7/llvm-stable -b gcc64 gcc

          echo "Cloning GCC32"
          git clone --depth=1 https://github.com/sohamxda7/llvm-stable -b gcc32 gcc32

          echo "Cloning libufdt for DTBO"
          git clone https://android.googlesource.com/platform/system/libufdt ufdt

      - name: 🏗️ Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="runner"
          export KBUILD_BUILD_HOST="github"
          export CLANG_PATH=/home/runner/toolchains/clang-llvm
          export GCC64_PATH=/home/runner/toolchains/gcc
          export GCC32_PATH=/home/runner/toolchains/gcc32
          export PATH=$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH
          export KBUILD_COMPILER_STRING="$($CLANG_PATH/bin/clang --version | head -n 1)"
          export PROCS=$(nproc)

          echo "Compiler: $KBUILD_COMPILER_STRING"

          echo "Cleaning output directory"
          rm -rf out && mkdir out

          echo "Running defconfig"
          make O=out persephone_defconfig

          echo "Compiling kernel"
          make -j$PROCS O=out \
            CC="ccache clang" \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: 🧱 Build DTBO Image
        if: success()
        run: |
          python2 /home/runner/toolchains/ufdt/utils/src/mkdtboimg.py \
            create out/arch/arm64/boot/dtbo.img --page_size=4096 \
            out/arch/arm64/boot/dts/vendor/qcom/avicii-overlay.dtbo

      - name: 📦 Create Flashable ZIP
        run: |
          cd AnyKernel3
          cp ../out/arch/arm64/boot/Image .
          cp ../out/arch/arm64/boot/dtbo.img .
          cp -af ../init.PersSpectrum.rc init.spectrum.rc
          sed -i 's/persist.spectrum.kernel.*/persist.spectrum.kernel Persephone/g' init.spectrum.rc

          zip -r9 Persephone-X2-A11-avicii-$(date +%Y%m%d-%H%M).zip * -x .git README.md

      - name: ☁️ Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Persephone-Kernel-ZIP
          path: AnyKernel3/*.zi
