name: Build Persephone Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: 📥 Checkout Kernel Source (with AnyKernel3)
      uses: actions/checkout@v4

    - name: 📥 Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

    - name: ⚙️ Build the Kernel
      run: |
        # Setup paths and environment
        export KERNEL_DIR=$(pwd)
        export CLANG_PATH=$KERNEL_DIR/clang
        export PATH=$CLANG_PATH/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER=ajit
        export KBUILD_BUILD_HOST=github-ci

        # Clean and prepare
        make O=out ARCH=arm64 persephone_defconfig

        # Build the kernel
        make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

        # Check for build success
        if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "❌ Build failed: Image.gz-dtb not found"
          exit 1
        fi

        # Copy Image.gz-dtb to AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

    - name: 📦 Create Flashable ZIP
      run: |
        cd AnyKernel3
        zip -r9 ../Persephone-Kernel.zip * -x .git README.md

    - name: 📤 Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Persephone-Kernel-ZIP
        path: Persephone-Kernel.zip
